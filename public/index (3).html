<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Catan Mobile 8-Players Edition</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg-color:#1a1a2e;--panel-bg:rgba(22,33,62,.96);--accent-gold:#f39c12;--text-main:#fff;
  --border-color:#0f3460;--btn-blue:#0984e3;--btn-green:#00b894;--btn-red:#d63031;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg-color);color:var(--text-main);overflow:hidden;width:100vw;height:100dvh}
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.screen.active{display:flex;flex-direction:column}
#lobby-screen{justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);overflow-y:auto}
.lobby-card{background:var(--panel-bg);border:2px solid var(--accent-gold);border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
.lobby-title{font-size:28px;color:var(--accent-gold);margin-bottom:8px;font-weight:bold;letter-spacing:2px}
.lobby-subtitle{font-size:14px;color:#8a99ad;margin-bottom:24px}
.input-group{margin-bottom:16px;text-align:left}
.input-group label{display:block;font-size:12px;color:#a4b0be;margin-bottom:6px}
.input-control{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border-color);background:#0f172a;color:#fff;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
.input-control:focus{border-color:var(--accent-gold)}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:8px;color:#fff}
.btn-primary{background:var(--btn-blue)}.btn-success{background:var(--btn-green)}.btn-warning{background:var(--accent-gold);color:#000}.btn-danger{background:var(--btn-red)}.btn-gray{background:#475569}
.btn-sm{padding:8px 10px;font-size:13px;width:auto;margin-top:0}
.btn:active{transform:scale(.98);opacity:.9}.btn:disabled{opacity:.45;cursor:not-allowed}
.room-players-list{margin:16px 0;background:rgba(0,0,0,.2);border-radius:8px;padding:12px;max-height:240px;overflow-y:auto}
.player-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.player-color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;border:1px solid #fff}
.tier-box{background:rgba(243,156,18,.12);border:1px solid rgba(243,156,18,.5);border-radius:8px;padding:8px 10px;font-size:12px;color:#fde3a7;line-height:1.5;text-align:left}

#game-screen{position:relative;background:#0d1b2a}
#game-canvas{width:100%;height:100%;display:block;touch-action:none}
.header-bar{position:absolute;top:0;left:0;right:0;height:48px;background:var(--panel-bg);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:10;gap:8px}
.phase-badge{background:var(--accent-gold);color:#000;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.room-info{font-size:11px;color:#a4b0be;white-space:nowrap}
.icon-btn{background:#1e293b;border:1px solid var(--border-color);color:#fff;border-radius:8px;width:34px;height:34px;font-size:16px}
.players-bar{position:absolute;top:48px;left:0;right:0;height:42px;background:rgba(0,0,0,.65);display:flex;align-items:center;overflow-x:auto;padding:0 8px;gap:6px;z-index:9;scrollbar-width:none}
.players-bar::-webkit-scrollbar{display:none}
.player-card-mini{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);padding:4px 8px;border-radius:6px;font-size:11px;border-left:5px solid #fff;white-space:nowrap}
.player-card-mini.active-turn{background:rgba(243,156,18,.28);box-shadow:0 0 8px rgba(243,156,18,.6)}
.player-card-mini.off{opacity:.45}
.player-card-mini.me b{color:var(--accent-gold)}
.bottom-ui{position:absolute;bottom:0;left:0;right:0;background:var(--panel-bg);border-top:1px solid var(--border-color);display:flex;flex-direction:column;padding:6px 10px calc(10px + env(safe-area-inset-bottom));gap:6px;z-index:10}
#hint{font-size:12px;color:#fde3a7;min-height:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.3}
.resources-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.4);border-radius:8px;padding:5px 10px}
.res-item{display:flex;flex-direction:column;align-items:center;font-size:10px;gap:1px;min-width:44px}
.res-icon{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px}
.res-wood{background:#27ae60;color:#fff}.res-brick{background:#d35400;color:#fff}.res-wheat{background:#f1c40f;color:#000}.res-wool{background:#8bc34a;color:#000}.res-ore{background:#7f8c8d;color:#fff}
.res-count{font-weight:bold;font-size:14px}.res-ratio{font-size:9px;color:#8a99ad}
.actions-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.action-btn{background:#1e293b;border:1px solid var(--border-color);color:#fff;padding:8px 2px;border-radius:6px;font-size:11px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.action-btn:disabled{opacity:.35;cursor:not-allowed}
.action-btn.pulse:not(:disabled){border-color:var(--accent-gold);box-shadow:0 0 10px rgba(243,156,18,.7)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;justify-content:center;align-items:center;padding:14px}
.modal-overlay.active{display:flex}
.modal-body{background:var(--panel-bg);border:2px solid var(--accent-gold);border-radius:12px;padding:16px;width:100%;max-width:400px;max-height:88dvh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.modal-title{font-size:18px;color:var(--accent-gold);margin-bottom:10px;text-align:center;font-weight:bold}
.modal-desc{font-size:13px;color:#cbd5e1;margin-bottom:12px;line-height:1.45;text-align:center}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.row.sp{justify-content:space-between}
.card-row{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);padding:7px 10px;border-radius:6px;font-size:13px;gap:8px}
.counter-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--btn-blue);color:#fff;font-weight:bold;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border-color);background:#1e293b;color:#fff;font-weight:bold;font-size:13px}
.tab.on{background:var(--accent-gold);color:#000}
.res-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.res-pick button{padding:10px 2px;border-radius:8px;border:2px solid transparent;font-weight:bold;font-size:12px;color:#000}
.res-pick button.sel{border-color:#fff;box-shadow:0 0 8px #fff}
.res-pick button:disabled{opacity:.3}
.small{font-size:11px;color:#94a3b8;line-height:1.5}
h4{font-size:13px;color:#fde3a7;margin:8px 0 4px}
ul.rules{padding-left:18px;font-size:12px;color:#cbd5e1;line-height:1.6}
.log{max-height:150px;overflow-y:auto;background:rgba(0,0,0,.3);border-radius:6px;padding:6px 8px;font-size:11px;color:#cbd5e1;line-height:1.5}

#trade-banner{position:absolute;top:96px;left:8px;right:8px;z-index:40;display:none}
#trade-banner .box{background:rgba(15,23,42,.97);border:2px solid var(--accent-gold);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:6px;max-width:440px;margin:0 auto}
.chip{display:inline-block;padding:1px 6px;border-radius:4px;font-weight:bold;font-size:11px;color:#000;margin:1px}
#toast-container{position:absolute;top:142px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;width:92%;max-width:340px}
.toast{background:rgba(15,23,42,.95);border-left:4px solid var(--accent-gold);padding:8px 12px;border-radius:6px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:fadeIn .25s forwards;line-height:1.35}
.toast.err{border-left-color:#ff6b6b;background:rgba(80,20,20,.95)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dice-result-overlay{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;opacity:0;transition:opacity .3s}
.dice-result-overlay.show{opacity:1}
.dice-row{display:flex;gap:12px}
.dice{width:54px;height:54px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;box-shadow:0 6px 16px rgba(0,0,0,.6)}
.dice-label{background:rgba(0,0,0,.75);padding:3px 10px;border-radius:10px;font-size:12px}
</style>
</head>
<body>

<!-- ===== LOBBY ===== -->
<div id="lobby-screen" class="screen active">
  <div class="lobby-card">
    <div class="lobby-title">CATAN MOBILE</div>
    <div class="lobby-subtitle">8-Players Online Edition（3〜8人）</div>

    <div id="lobby-menu">
      <div class="input-group">
        <label>プレイヤー名</label>
        <input type="text" id="player-name-input" class="input-control" placeholder="名前を入力..." maxlength="10">
      </div>
      <button class="btn btn-primary" onclick="showCreateRoom()">部屋を作成する</button>
      <button class="btn btn-success" onclick="showJoinRoom()">ルームコードで入室</button>
      <div class="tier-box" style="margin-top:16px">
        <b>人数でルールが変わります</b><br>
        3〜4人：標準ルール（19タイル）<br>
        5〜6人：拡張マップ（30タイル）＋特別建設フェーズ<br>
        7〜8人：大型マップ（37タイル）＋特別建設フェーズ＋カード増量
      </div>
    </div>

    <div id="create-room-menu" style="display:none">
      <div class="input-group">
        <label>目標勝利点</label>
        <select id="target-score-input" class="input-control">
          <option value="">自動（3〜6人:10点 / 7〜8人:12点）</option>
          <option value="10">10点</option><option value="11">11点</option><option value="12">12点</option>
          <option value="13">13点</option><option value="14">14点</option>
        </select>
      </div>
      <button class="btn btn-warning" onclick="createRoomAction()">部屋を作成して待機</button>
      <button class="btn btn-danger" onclick="backToLobbyMenu()">戻る</button>
    </div>

    <div id="join-room-menu" style="display:none">
      <div class="input-group">
        <label>ルームコード (6桁)</label>
        <input type="text" id="room-code-input" class="input-control" placeholder="例: 849201" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn btn-success" onclick="joinRoomAction()">参加する</button>
      <button class="btn btn-danger" onclick="backToLobbyMenu()">戻る</button>
    </div>

    <div id="waiting-room-menu" style="display:none">
      <div style="font-size:14px;color:#a4b0be;margin-bottom:4px">ルームコード</div>
      <div id="display-room-code" style="font-size:32px;font-weight:bold;color:var(--accent-gold);letter-spacing:4px;margin-bottom:8px">------</div>
      <div class="tier-box" id="tier-info"></div>
      <div class="room-players-list" id="room-players-list"></div>
      <button class="btn btn-warning" id="start-game-btn" onclick="startGameAction()">ゲーム開始 (ホストのみ)</button>
      <div class="small" id="wait-note" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="game-screen" class="screen">
  <canvas id="game-canvas"></canvas>
  <div class="header-bar">
    <div class="phase-badge" id="current-phase-text">-</div>
    <div class="room-info" id="game-room-code">ROOM: -----</div>
    <div class="row" style="gap:6px">
      <button class="icon-btn" onclick="fitView()" title="全体表示">🎯</button>
      <button class="icon-btn" onclick="openInfo()" title="情報">ℹ️</button>
    </div>
  </div>
  <div class="players-bar" id="players-status-bar"></div>
  <div id="trade-banner"></div>
  <div id="toast-container"></div>
  <div class="dice-result-overlay" id="dice-overlay">
    <div class="dice-row"><div class="dice" id="dice1">1</div><div class="dice" id="dice2">1</div></div>
    <div class="dice-label" id="dice-label"></div>
  </div>
  <div class="bottom-ui" id="bottom-ui">
    <div id="hint"></div>
    <div class="resources-bar" id="resources-bar"></div>
    <div class="actions-grid">
      <button class="action-btn" id="btn-roll" onclick="handleRollDice()"><span>🎲</span><span>ダイス</span></button>
      <button class="action-btn" id="btn-build" onclick="openBuild()"><span>🏗️</span><span>建設</span></button>
      <button class="action-btn" id="btn-trade" onclick="openTrade()"><span>🔄</span><span>交易</span></button>
      <button class="action-btn" id="btn-dev" onclick="openDev()"><span>🃏</span><span id="dev-label">発展カード</span></button>
      <button class="action-btn" id="btn-end-turn" onclick="handleEndTurn()"><span>⏭️</span><span id="end-label">ターン終了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal"><div class="modal-body" id="modal-body"></div></div>

<script>
'use strict';
const socket = io();
const R = ['wood','brick','wheat','wool','ore'];
const RN = {wood:'木材',brick:'レンガ',wheat:'小麦',wool:'羊毛',ore:'鉱石'};
const RS = {wood:'木',brick:'土',wheat:'麦',wool:'羊',ore:'鉄'};
const RC = {wood:'#27ae60',brick:'#d35400',wheat:'#f1c40f',wool:'#8bc34a',ore:'#95a5a6'};
const TERR = {
  forest:{c:'#2e7d32',e:'🌲'}, hill:{c:'#bf5b2c',e:'🧱'}, field:{c:'#e0b92b',e:'🌾'},
  pasture:{c:'#8bc34a',e:'🐑'}, mountain:{c:'#78909c',e:'⛰️'}, desert:{c:'#e3cf9b',e:'🏜️'}
};
const COSTS = {road:{wood:1,brick:1},settlement:{wood:1,brick:1,wheat:1,wool:1},city:{wheat:2,ore:3},dev:{wheat:1,wool:1,ore:1}};
const DEV_NAME = {knight:'騎士',roadbuilding:'街道建設',yearofplenty:'収穫',monopoly:'独占',vp:'勝利ポイント'};
const DEV_DESC = {
  knight:'盗賊を動かして資源を1枚奪う。3枚以上で最大騎士力(2点)',
  roadbuilding:'資源なしで街道を2本敷設',
  yearofplenty:'好きな資源を2枚受け取る',
  monopoly:'資源を1種類指定し、他の全員から全て受け取る',
  vp:'1点（ゲーム終了時まで非公開・使用不可）'
};
const $ = (id) => document.getElementById(id);

let ME = null, TOKEN = null, ROOM = null, HOST = null;
let S = null, B = null, CFG = null;
let buildMode = null;
let view = {x:0,y:0,k:1};
let lastRollSeq = null;
let modalKind = null, modalRender = null;
let LOG = [];
let nodeOwner = {}, nodeType = {}, edgeOwner = {}, pcolor = {}, pname = {};
let canvas, ctx, dpr = 1, needAnim = false, drawQueued = false;

function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k.startsWith('on')) e[k] = v;
    else if(k==='disabled') e.disabled = !!v;
    else e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function chips(o){
  const f = document.createDocumentFragment();
  let any = false;
  R.forEach(r => { if(o && o[r] > 0){ any = true; f.append(h('span',{class:'chip',style:`background:${RC[r]}`}, RS[r]+'×'+o[r])); } });
  if(!any) f.append('なし');
  return f;
}
function showToast(msg, isErr){
  const c = $('toast-container'); if(!c) return;
  const t = h('div',{class:'toast'+(isErr?' err':'')}, msg);
  c.appendChild(t);
  while(c.children.length > 5) c.firstChild.remove();
  setTimeout(() => t.remove(), isErr ? 4200 : 3800);
}

/* ---------------- ロビー ---------------- */
function nameInput(){ return $('player-name-input').value.trim(); }
function showCreateRoom(){ if(!nameInput()) return showToastLobby('名前を入力してください'); $('lobby-menu').style.display='none'; $('create-room-menu').style.display='block'; }
function showJoinRoom(){ if(!nameInput()) return showToastLobby('名前を入力してください'); $('lobby-menu').style.display='none'; $('join-room-menu').style.display='block'; }
function showToastLobby(m){ alert(m); }
function backToLobbyMenu(){
  ['lobby-menu','create-room-menu','join-room-menu','waiting-room-menu'].forEach(id => { $(id).style.display = id==='lobby-menu' ? 'block' : 'none'; });
}
function createRoomAction(){
  socket.emit('createRoom', {name:nameInput(), targetScore:$('target-score-input').value});
}
function joinRoomAction(){
  const code = $('room-code-input').value.trim();
  if(code.length !== 6) return showToastLobby('6桁のコードを入力してください');
  socket.emit('joinRoom', {roomCode:code, name:nameInput()});
}
function startGameAction(){ socket.emit('startGame'); }
function saveSession(){ try{ localStorage.setItem('catan-session', JSON.stringify({code:ROOM, token:TOKEN})); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem('catan-session'); }catch(e){} }
function showWaiting(rs){
  ROOM = rs.roomCode;
  ['lobby-menu','create-room-menu','join-room-menu'].forEach(id => $(id).style.display='none');
  $('waiting-room-menu').style.display = 'block';
  $('display-room-code').textContent = rs.roomCode;
  renderLobby(rs);
}
function renderLobby(rs){
  HOST = rs.hostId;
  const list = $('room-players-list'); list.innerHTML = '';
  rs.players.forEach(p => {
    list.append(h('div',{class:'player-item'},
      h('div',{}, h('span',{class:'player-color-dot',style:`background:${p.color}`}), h('b',{},p.name), p.id===ME?' (あなた)':''),
      h('span',{class:'small'}, p.id===rs.hostId?'HOST':(p.connected?'READY':'切断中'))));
  });
  const n = rs.players.length, t = rs.tierInfo;
  const target = rs.targetScore || t.defaultTarget;
  $('tier-info').innerHTML = '';
  $('tier-info').append(
    h('b',{}, `現在 ${n}人 → ${t.label}`), h('br'),
    `盤面 ${t.hexes}タイル / 資源山札 各${t.bank}枚 / 発展カード ${t.devCards}枚`, h('br'),
    t.sbp ? '特別建設フェーズあり（手番終了後に他の全員が建設可能）' : '特別建設フェーズなし', h('br'),
    `目標: ${rs.targetScore ? rs.targetScore : '自動'}点${rs.targetScore?'':`（現在は${target}点）`}`
  );
  const btn = $('start-game-btn');
  btn.style.display = ME===rs.hostId ? 'flex' : 'none';
  btn.disabled = n < rs.minPlayers;
  $('wait-note').textContent = n < rs.minPlayers ? `${rs.minPlayers}人以上で開始できます（最大${rs.maxPlayers}人）` : (ME===rs.hostId ? '全員そろったら開始してください' : 'ホストの開始を待っています…');
}
socket.on('connect', () => {
  try{
    const s = JSON.parse(localStorage.getItem('catan-session') || 'null');
    if(s && s.code && s.token) socket.emit('rejoin', {roomCode:s.code, token:s.token});
  }catch(e){}
});
socket.on('rejoinFailed', () => { clearSession(); if(S){ location.reload(); } });
socket.on('roomCreated', ({roomCode, player, roomState}) => { ME = player.id; TOKEN = player.token; ROOM = roomCode; saveSession(); showWaiting(roomState); });
socket.on('joinedSuccess', ({player, roomState}) => { ME = player.id; TOKEN = player.token; ROOM = roomState.roomCode; saveSession(); showWaiting(roomState); });
socket.on('rejoined', ({player, roomState}) => { ME = player.id; ROOM = roomState.roomCode; if(!roomState.started) showWaiting(roomState); });
socket.on('roomUpdated', rs => { if(!S) renderLobby(rs); });

/* ---------------- ゲーム開始・同期 ---------------- */
socket.on('gameStarted', ({roomCode, myId, config, board}) => {
  ME = myId; ROOM = roomCode; CFG = config; B = board; S = null; lastRollSeq = null; LOG = [];
  $('lobby-screen').classList.remove('active');
  $('game-screen').classList.add('active');
  $('game-room-code').textContent = `ROOM ${roomCode} · 目標${config.targetScore}点`;
  initCanvas();
  requestAnimationFrame(() => { resizeCanvas(); fitView(); });
});
socket.on('gameStateSync', st => {
  const first = S === null;
  S = st;
  nodeOwner = {}; nodeType = {}; edgeOwner = {}; pcolor = {}; pname = {};
  st.buildings.forEach(b => { nodeOwner[b.node] = b.owner; nodeType[b.node] = b.type; });
  st.roads.forEach(r => { edgeOwner[r.edge] = r.owner; });
  st.players.forEach(p => { pcolor[p.id] = p.color; pname[p.id] = p.name; });
  if(first){ lastRollSeq = st.lastRoll ? st.lastRoll.seq : 0; }
  else if(st.lastRoll && st.lastRoll.seq !== lastRollSeq){ lastRollSeq = st.lastRoll.seq; showDice(st.lastRoll); }
  if(buildMode && !canBuildNow()) buildMode = null;
  renderUI();
});
socket.on('toast', m => { LOG.push(m); if(LOG.length > 80) LOG.shift(); showToast(m); });
socket.on('errorMsg', m => showToast('⚠️ ' + m, true));

/* ---------------- 状態ヘルパー ---------------- */
function meIdx(){ return S ? S.players.findIndex(p => p.id === ME) : -1; }
function isActive(){ return !!S && S.activeIdx === meIdx(); }
function pendingAny(){ return !!S && (Object.keys(S.discardPending||{}).length > 0 || !!S.robberPending); }
function ctxNow(){
  if(!S) return null;
  if(S.phase==='MAIN' && isActive() && S.turnRolled && !pendingAny()) return 'turn';
  if(S.phase==='SPECIAL' && S.special && S.special.current === meIdx()) return 'special';
  return null;
}
function canBuildNow(){ return !!ctxNow(); }
function canPay(cost){ return R.every(r => (S.myResources[r]||0) >= (cost[r]||0)); }
function costText(c){ return R.filter(r=>c[r]).map(r => RS[r]+c[r]).join(' '); }
function currentMode(){
  if(!S || S.phase==='GAME_OVER') return null;
  const L = S.legal;
  if(S.phase==='SETUP'){ if(L.settlement.length) return 'settlement'; if(L.road.length) return 'road'; return null; }
  if(L.robberHexes.length) return 'robber';
  if(S.freeRoads > 0 && L.road.length && isActive()) return 'road';
  return buildMode;
}
function highlightSet(){
  const m = currentMode(); if(!m) return null;
  if(m==='settlement') return {kind:'node', ids:S.legal.settlement};
  if(m==='city') return {kind:'node', ids:S.legal.city};
  if(m==='road') return {kind:'edge', ids:S.legal.road};
  if(m==='robber') return {kind:'hex', ids:S.legal.robberHexes};
  return null;
}

/* ---------------- キャンバス ---------------- */
function initCanvas(){
  if(canvas) return;
  canvas = $('game-canvas'); ctx = canvas.getContext('2d');
  window.addEventListener('resize', () => { resizeCanvas(); fitView(); });
  const ptrs = new Map(); let down = null, pinch = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(ptrs.size === 1) down = {x:e.clientX, y:e.clientY, moved:false};
    else { if(down) down.moved = true; pinch = pinchInfo(ptrs); }
  });
  canvas.addEventListener('pointermove', e => {
    if(!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(ptrs.size === 1){
      view.x += e.clientX - prev.x; view.y += e.clientY - prev.y;
      if(down && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 8) down.moved = true;
      queueDraw();
    } else if(ptrs.size === 2 && pinch){
      const now = pinchInfo(ptrs);
      zoomAt(now.cx, now.cy, now.d / pinch.d);
      view.x += now.cx - pinch.cx; view.y += now.cy - pinch.cy;
      pinch = now; queueDraw();
    }
  });
  const up = e => {
    if(!ptrs.has(e.pointerId)) return;
    const wasOne = ptrs.size === 1;
    ptrs.delete(e.pointerId);
    if(wasOne && down && !down.moved) onTap(e.clientX, e.clientY);
    if(ptrs.size < 2) pinch = null;
    if(ptrs.size === 0) down = null;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; down = null; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12); queueDraw(); }, {passive:false});
  const loop = () => { if(needAnim && S) draw(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function pinchInfo(ptrs){
  const a = [...ptrs.values()];
  return {cx:(a[0].x+a[1].x)/2, cy:(a[0].y+a[1].y)/2, d:Math.max(1, Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y))};
}
function zoomAt(sx, sy, f){
  const nk = Math.max(0.35, Math.min(4, view.k * f)); f = nk / view.k;
  view.x = sx - (sx - view.x) * f; view.y = sy - (sy - view.y) * f; view.k = nk;
}
function resizeCanvas(){
  if(!canvas) return;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  queueDraw();
}
function fitView(){
  if(!B) return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  B.hexes.forEach(hx => { x0=Math.min(x0,hx.cx-48); x1=Math.max(x1,hx.cx+48); y0=Math.min(y0,hx.cy-52); y1=Math.max(y1,hx.cy+52); });
  const top = 96, bottom = $('bottom-ui').offsetHeight + 6;
  const availW = innerWidth - 8, availH = Math.max(120, innerHeight - top - bottom);
  const k = Math.min(availW/(x1-x0), availH/(y1-y0), 1.6);
  view.k = k;
  view.x = innerWidth/2 - ((x0+x1)/2) * k;
  view.y = top + availH/2 - ((y0+y1)/2) * k;
  queueDraw();
}
function queueDraw(){ if(drawQueued) return; drawQueued = true; requestAnimationFrame(() => { drawQueued = false; draw(); }); }

function hexPath(cx, cy, r){
  ctx.beginPath();
  for(let i=0;i<6;i++){ const a = Math.PI/180*(60*i-30); const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
}
function draw(){
  if(!ctx || !B || !S) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#0d2a45'; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);
  const hs = highlightSet();
  needAnim = !!hs;
  const pulse = 0.5 + 0.5*Math.sin(Date.now()/260);

  // 地形
  B.hexes.forEach(hx => {
    const t = TERR[hx.type] || {c:'#777',e:''};
    hexPath(hx.cx, hx.cy, 40); ctx.fillStyle = t.c; ctx.fill(); ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = '15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = .75;
    ctx.fillText(t.e, hx.cx, hx.cy - 22); ctx.globalAlpha = 1;
    if(hx.number){
      ctx.beginPath(); ctx.arc(hx.cx, hx.cy+1, 13, 0, Math.PI*2); ctx.fillStyle = '#fdf3d0'; ctx.fill(); ctx.strokeStyle='#5a4a1a'; ctx.lineWidth=1; ctx.stroke();
      const red = hx.number===6 || hx.number===8;
      ctx.fillStyle = red ? '#d63031' : '#111'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(hx.number, hx.cx, hx.cy-1);
      const pips = 6 - Math.abs(7 - hx.number);
      for(let i=0;i<pips;i++){ ctx.beginPath(); ctx.arc(hx.cx + (i-(pips-1)/2)*3.6, hx.cy+9, 1.2, 0, Math.PI*2); ctx.fillStyle = red?'#d63031':'#333'; ctx.fill(); }
    }
  });
  // 港
  (B.ports||[]).forEach(p => {
    const A = B.nodes[p.a], Bn = B.nodes[p.b], px = p.mx + p.ox*26, py = p.my + p.oy*26;
    ctx.strokeStyle = '#c9b27a'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(A.x, A.y); ctx.lineTo(px, py); ctx.lineTo(Bn.x, Bn.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI*2); ctx.fillStyle = '#12304f'; ctx.fill();
    ctx.strokeStyle = p.type==='any' ? '#e8e8e8' : RC[p.type]; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.ratio+':1', px, py-4);
    ctx.fillStyle = p.type==='any' ? '#fff' : RC[p.type]; ctx.font = 'bold 9px sans-serif';
    ctx.fillText(p.type==='any' ? '?' : RS[p.type], px, py+5);
  });
  // 街道
  B.edges.forEach(e => {
    const o = edgeOwner[e.id]; if(!o) return;
    const a = B.nodes[e.a], b = B.nodes[e.b];
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.strokeStyle = pcolor[o] || '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  // ハイライト（候補）
  if(hs){
    if(hs.kind==='edge') hs.ids.forEach(id => {
      const e = B.edges[id], a = B.nodes[e.a], b = B.nodes[e.b];
      ctx.lineCap='round'; ctx.strokeStyle = `rgba(255,215,0,${.45+.4*pulse})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    });
    if(hs.kind==='hex') hs.ids.forEach(id => {
      const hx = B.hexes[id]; hexPath(hx.cx, hx.cy, 38); ctx.fillStyle = `rgba(255,255,255,${.12+.2*pulse})`; ctx.fill();
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.stroke();
    });
  }
  // 建物
  B.nodes.forEach(n => {
    const o = nodeOwner[n.id]; if(!o) return;
    const col = pcolor[o] || '#fff';
    ctx.fillStyle = col; ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    if(nodeType[n.id] === 'city'){
      ctx.moveTo(n.x-11,n.y+7); ctx.lineTo(n.x-11,n.y-3); ctx.lineTo(n.x-5,n.y-9); ctx.lineTo(n.x,n.y-3); ctx.lineTo(n.x+11,n.y-3); ctx.lineTo(n.x+11,n.y+7);
    } else {
      ctx.moveTo(n.x-7,n.y+6); ctx.lineTo(n.x-7,n.y-2); ctx.lineTo(n.x,n.y-9); ctx.lineTo(n.x+7,n.y-2); ctx.lineTo(n.x+7,n.y+6);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  if(hs && hs.kind==='node') hs.ids.forEach(id => {
    const n = B.nodes[id];
    ctx.beginPath(); ctx.arc(n.x, n.y, 9 + 2*pulse, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,215,0,${.35+.35*pulse})`; ctx.fill(); ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.stroke();
  });
  // 盗賊
  const rh = B.hexes[S.robber];
  if(rh){
    ctx.beginPath(); ctx.ellipse(rh.cx+17, rh.cy+15, 6, 8, 0, 0, Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(rh.cx+17, rh.cy+5, 4.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function onTap(sx, sy){
  if(!S || !B) return;
  const mode = currentMode(); if(!mode) return;
  const wx = (sx - view.x)/view.k, wy = (sy - view.y)/view.k;
  const hs = highlightSet(); if(!hs) return;
  if(hs.kind === 'node'){
    let best = null, bd = 1e9;
    hs.ids.forEach(id => { const n = B.nodes[id], d = Math.hypot(n.x-wx, n.y-wy); if(d < bd){ bd = d; best = id; } });
    if(best === null || bd*view.k > 34) return;
    if(S.phase==='SETUP') socket.emit('setupPlaceSettlement', {nodeId:best});
    else { socket.emit('buildStructure', {type:mode, nodeId:best}); buildMode = null; }
  } else if(hs.kind === 'edge'){
    let best = null, bd = 1e9;
    hs.ids.forEach(id => { const e = B.edges[id], d = segDist(wx, wy, B.nodes[e.a], B.nodes[e.b]); if(d < bd){ bd = d; best = id; } });
    if(best === null || bd*view.k > 26) return;
    if(S.phase==='SETUP') socket.emit('setupPlaceRoad', {edgeId:best});
    else { socket.emit('buildStructure', {type:'road', edgeId:best}); if(S.freeRoads <= 1) buildMode = null; }
  } else if(hs.kind === 'hex'){
    let best = null, bd = 1e9;
    hs.ids.forEach(id => { const hx = B.hexes[id], d = Math.hypot(hx.cx-wx, hx.cy-wy); if(d < bd){ bd = d; best = id; } });
    if(best === null || bd > 38) return;
    const victims = [...new Set(B.hexes[best].nodeIds.map(n => nodeOwner[n]).filter(o => o && o !== ME))];
    if(victims.length > 1) openVictim(best, victims);
    else socket.emit('moveRobber', {hexId:best, targetPlayerId:victims[0] || null});
  }
}
function segDist(px, py, a, b){
  const dx = b.x-a.x, dy = b.y-a.y, t = Math.max(0, Math.min(1, ((px-a.x)*dx + (py-a.y)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(px-(a.x+t*dx), py-(a.y+t*dy));
}

/* ---------------- UI描画 ---------------- */
function showDice(lr){
  $('dice1').textContent = lr.dice[0]; $('dice2').textContent = lr.dice[1];
  $('dice-label').textContent = `${pname[lr.by]||''} の出目: ${lr.total}`;
  const o = $('dice-overlay'); o.classList.add('show'); setTimeout(() => o.classList.remove('show'), 1700);
}
function hintText(){
  if(!S) return '';
  const nm = i => S.players[i] ? S.players[i].name : '';
  if(S.phase === 'GAME_OVER') return 'ゲーム終了';
  if(S.phase === 'SETUP'){
    const cur = S.setup.current;
    if(cur === meIdx()) return S.setup.step==='settlement'
      ? `初期配置(${S.setup.round}/2): 光っている交差点をタップして開拓地を置く`
      : `初期配置(${S.setup.round}/2): 開拓地に接する街道を置く`;
    return `${nm(cur)} が初期配置中 (${S.setup.round}/2巡目)`;
  }
  if(S.discardPending[ME]) return '7が出ました。手札を廃棄してください';
  const waiting = Object.keys(S.discardPending);
  if(waiting.length) return `廃棄待ち: ${waiting.map(id => pname[id]).join('・')}`;
  if(S.robberPending){
    return S.robberPending.by === ME ? '盗賊を動かす地形をタップ（今と同じ場所は不可）' : `${pname[S.robberPending.by]} が盗賊を移動中`;
  }
  if(S.freeRoads > 0 && isActive()) return `街道建設カード: 街道を置いてください（残り${S.freeRoads}本）`;
  if(buildMode && ctxNow()) return `${{settlement:'開拓地',city:'都市',road:'街道'}[buildMode]}を置く場所をタップ`;
  if(S.phase === 'SPECIAL'){
    return S.special.current === meIdx() ? '特別建設フェーズ: 建設・発展カード購入ができます（交易不可）' : `${nm(S.special.current)} の特別建設中`;
  }
  if(isActive()) return S.turnRolled ? '交易・建設ができます。終わったらターン終了' : 'ダイスを振ってください（発展カードはいつでも使用可）';
  return `${nm(S.activeIdx)} のターン`;
}

  // ボタン

  $('btn-roll').disabled = !(S.phase==='MAIN' && isActive() && !S.turnRolled && !pend);
  $('btn-roll').classList.toggle('pulse', !$('btn-roll').disabled);
  $('btn-build').disabled = !ctxn && !(S.freeRoads>0 && isActive());
  $('btn-trade').disabled = ctxn !== 'turn';
  $('btn-dev').disabled = S.phase==='SETUP' || S.phase==='GAME_OVER' || (!ctxn && !(S.phase==='MAIN' && isActive()));
  const myDevN = S.myDev.length;

  $('btn-end-turn').disabled = !canEnd;
  $('end-label').textContent = S.phase==='SPECIAL' ? '建設終了' : 'ターン終了';
  renderTradeBanner();
  // モーダルの自動制御
  if(S.phase==='GAME_OVER'){ if(modalKind!=='winner') openWinner(); }
  else if(S.discardPending[ME]){ if(modalKind!=='discard') openDiscard(S.discardPending[ME]); }
  else if(modalKind==='discard') closeModal();
  else if(modalKind && modalKind!=='victim' && modalKind!=='pick' && modalRender) renderModal();
  queueDraw();
}

/* ---------------- アクション ---------------- */

/* ---------------- モーダル基盤 ---------------- */

const closeBtn = (label='閉じる') => h('button',{class:'btn btn-gray', onclick:closeModal}, label);

/* 発展カード */
function openDev(){
  openModal('dev', body => {
    body.append(h('div',{class:'modal-title'}, '発展カード'));
    const ctxn = ctxNow();
    const canBuy = !!ctxn && canPay(COSTS.dev) && S.deckCount > 0;
    body.append(h('button',{class:'btn btn-success', disabled:!canBuy, onclick:() => socket.emit('buyDevelopment')},
      `🃏 購入 (${costText(COSTS.dev)})  山札残り${S.deckCount}`));
    const cnt = {}, fresh = {};
    S.myDev.forEach(c => { cnt[c.type] = (cnt[c.type]||0)+1; if(c.fresh) fresh[c.type] = (fresh[c.type]||0)+1; });
    const canPlayBase = S.phase==='MAIN' && isActive() && !pendingAny() && !S.devPlayed && S.freeRoads===0;
    body.append(h('h4',{}, `手持ちのカード${S.devPlayed?'（このターンは使用済み）':''}`));
    const col = h('div',{class:'col'});
    ['knight','roadbuilding','yearofplenty','monopoly','vp'].forEach(t => {
      if(!cnt[t]) return;
      const usable = cnt[t] - (fresh[t]||0);
      const row = h('div',{class:'card-row'},
        h('div',{}, h('b',{}, `${DEV_NAME[t]} ×${cnt[t]}`), h('div',{class:'small'}, DEV_DESC[t] + (fresh[t]?`（今回購入${fresh[t]}枚は次のターンから）`:''))));
      if(t !== 'vp') row.append(h('button',{class:'btn btn-sm btn-warning', disabled:!(canPlayBase && usable>0), onclick:() => playDevCard(t)}, '使う'));
      col.append(row);
    });
    if(!S.myDev.length) col.append(h('div',{class:'small'}, 'カードを持っていません'));
    body.append(col, closeBtn());
  });
}
function playDevCard(t){
  if(t === 'yearofplenty') pickResources('収穫：資源を2つ選択', 2, picks => { socket.emit('playDev', {card:t, params:{res:picks}}); closeModal(); });
  else if(t === 'monopoly') pickResources('独占：資源を1つ選択', 1, picks => { socket.emit('playDev', {card:t, params:{res:picks[0]}}); closeModal(); });
  else { socket.emit('playDev', {card:t}); closeModal(); }
}
function pickResources(title, count, cb){
  const picks = [];
  openModal('pick', body => {
    body.append(h('div',{class:'modal-title'}, title));
    const grid = h('div',{class:'res-pick'});
    R.forEach(r => grid.append(h('button',{style:`background:${RC[r]}`, onclick:() => { picks.push(r); if(picks.length >= count) cb(picks.slice()); else renderModal(); }}, RN[r])));
    body.append(grid, h('div',{class:'modal-desc', style:'margin-top:10px'}, `選択中: ${picks.map(r => RN[r]).join('・') || 'なし'}`), closeBtn('キャンセル'));
  });
}

/* 7の廃棄 */
let discardSel = {wood:0,brick:0,wheat:0,wool:0,ore:0}, discardNeed = 0;
function openDiscard(need){
  discardNeed = need; discardSel = {wood:0,brick:0,wheat:0,wool:0,ore:0};
  openModal('discard', body => {
    const sum = R.reduce((s,r) => s + discardSel[r], 0);
    body.append(h('div',{class:'modal-title'}, '⚠️ 7が出ました'), h('div',{class:'modal-desc'}, `手札が8枚以上のため ${discardNeed} 枚を廃棄します（選択 ${sum}/${discardNeed}）`));
    const col = h('div',{class:'col'});
    R.forEach(r => {
      const have = S.myResources[r]||0;
      col.append(h('div',{class:'card-row'}, h('span',{}, `${RN[r]} (所持:${have})`),
        h('div',{class:'row'},
          h('button',{class:'counter-btn', onclick:() => { if(discardSel[r]>0){ discardSel[r]--; renderModal(); } }}, '−'),
          h('b',{style:'min-width:18px;text-align:center'}, discardSel[r]),
          h('button',{class:'counter-btn', onclick:() => { if(discardSel[r]<have && R.reduce((s,x)=>s+discardSel[x],0)<discardNeed){ discardSel[r]++; renderModal(); } }}, '+'))));
    });
    body.append(col, h('button',{class:'btn btn-danger', disabled:sum!==discardNeed, onclick:() => { socket.emit('discardResources', {discardedRes:discardSel}); }}, '廃棄を確定'));
  });
}

/* 盗賊の被害者選択 */
function openVictim(hexId, victims){
  openModal('victim', body => {
    body.append(h('div',{class:'modal-title'}, 'どのプレイヤーから奪いますか？'));
    const col = h('div',{class:'col'});
    victims.forEach(id => {
      const p = S.players.find(x => x.id === id);
      col.append(h('button',{class:'btn btn-primary', style:`border-left:8px solid ${p.color}`, onclick:() => { socket.emit('moveRobber', {hexId, targetPlayerId:id}); closeModal(); }}, `${p.name}（手札${p.cards}枚）`));
    });
    col.append(closeBtn('キャンセル'));
    body.append(col);
  });
}

/* 交易 */
let tradeTab = 'player';
let draft = {give:{wood:0,brick:0,wheat:0,wool:0,ore:0}, want:{wood:0,brick:0,wheat:0,wool:0,ore:0}};
let bankGive = null, bankGet = null;
function openTrade(){ openModal('trade', renderTrade); }
function renderTrade(body){
  body.append(h('div',{class:'modal-title'}, '交易'));
  body.append(h('div',{class:'tabs'},
    h('button',{class:'tab'+(tradeTab==='player'?' on':''), onclick:() => { tradeTab='player'; renderModal(); }}, 'プレイヤーと交易'),
    h('button',{class:'tab'+(tradeTab==='bank'?' on':''), onclick:() => { tradeTab='bank'; renderModal(); }}, '銀行・港')));
  if(ctxNow() !== 'turn'){ body.append(h('div',{class:'modal-desc'}, '今は交易できません'), closeBtn()); return; }
  if(tradeTab === 'bank'){
    body.append(h('div',{class:'modal-desc'}, '同じ資源を比率分渡して、好きな資源1枚と交換（4:1／一般港3:1／専門港2:1）'));
    body.append(h('h4',{}, '渡す資源'));
    const g = h('div',{class:'res-pick'});
    R.forEach(r => { const ratio = S.myRatios[r]||4; g.append(h('button',{class:bankGive===r?'sel':'', style:`background:${RC[r]}`, disabled:(S.myResources[r]||0)<ratio, onclick:() => { bankGive = r; if(bankGet===r) bankGet=null; renderModal(); }}, `${RS[r]} ${ratio}:1`)); });
    body.append(g, h('h4',{}, '受け取る資源'));
    const g2 = h('div',{class:'res-pick'});
    R.forEach(r => g2.append(h('button',{class:bankGet===r?'sel':'', style:`background:${RC[r]}`, disabled:bankGive===r || S.bank[r]<1, onclick:() => { bankGet = r; renderModal(); }}, RS[r]+(S.bank[r]<1?'(なし)':''))));
    body.append(g2, h('button',{class:'btn btn-warning', style:'margin-top:12px', disabled:!(bankGive&&bankGet), onclick:() => { socket.emit('bankTrade', {give:bankGive, get:bankGet}); }}, bankGive&&bankGet?`${RN[bankGive]}×${S.myRatios[bankGive]} → ${RN[bankGet]}×1 を交換`:'資源を選択'), closeBtn());
    return;
  }
  if(S.trade && S.trade.from === ME){
    body.append(h('div',{class:'modal-desc'}, '交易を提案中です。画面上部で各プレイヤーの応答を確認し、成立させる相手を選んでください。'),
      h('button',{class:'btn btn-danger', onclick:() => socket.emit('cancelTrade')}, '提案を取り消す'), closeBtn());
    return;
  }
  body.append(h('div',{class:'modal-desc'}, '手番プレイヤーとの交換のみ可能です。同じ種類の資源を両側に含めることはできません。'));
  const section = (title, key, other, limit) => {
    body.append(h('h4',{}, title));
    R.forEach(r => body.append(h('div',{class:'card-row'}, h('span',{}, `${RN[r]}${limit?` (所持:${S.myResources[r]||0})`:''}`),
      h('div',{class:'row'},
        h('button',{class:'counter-btn', onclick:() => { if(draft[key][r]>0){ draft[key][r]--; renderModal(); } }}, '−'),
        h('b',{style:'min-width:18px;text-align:center'}, draft[key][r]),
        h('button',{class:'counter-btn', onclick:() => { if(!limit || draft[key][r] < (S.myResources[r]||0)){ draft[key][r]++; draft[other][r] = 0; renderModal(); } }}, '+')))));
  };
  section('渡す資源', 'give', 'want', true);
  section('欲しい資源', 'want', 'give', false);
  const gs = R.reduce((s,r)=>s+draft.give[r],0), ws = R.reduce((s,r)=>s+draft.want[r],0);
  body.append(h('button',{class:'btn btn-warning', style:'margin-top:12px', disabled:!(gs&&ws), onclick:() => { socket.emit('proposeTrade', {give:draft.give, want:draft.want}); }}, '全員に提案する'), closeBtn());
}
function renderTradeBanner(){
  const el = $('trade-banner'); const t = S && S.trade;
  if(!t || S.phase !== 'MAIN'){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block'; el.innerHTML = '';
  const box = h('div',{class:'box'});
  if(t.from === ME){
    box.append(h('div',{}, h('b',{}, '提案中  '), '渡す:', chips(t.give), ' 欲しい:', chips(t.want)));
    S.players.filter(p => p.id !== ME).forEach(p => {
      const acc = t.accepted.includes(p.id), dec = t.declined.includes(p.id);
      const row = h('div',{class:'row sp'}, h('span',{style:`border-left:4px solid ${p.color};padding-left:6px`}, p.name + (acc?' ✅承諾':dec?' ❌拒否':' …待機')));
      if(acc) row.append(h('button',{class:'btn btn-sm btn-success', onclick:() => socket.emit('confirmTrade', {withId:p.id})}, 'この人と成立'));
      box.append(row);
    });
    box.append(h('button',{class:'btn btn-sm btn-danger', onclick:() => socket.emit('cancelTrade')}, '取り消し'));
  } else {
    const done = t.accepted.includes(ME) || t.declined.includes(ME);
    box.append(h('div',{}, h('b',{}, `${pname[t.from]} の提案  `), 'もらう:', chips(t.give), ' あなたが渡す:', chips(t.want)));
    if(done) box.append(h('div',{class:'small'}, t.accepted.includes(ME) ? '承諾しました。相手の決定を待っています…' : '拒否しました'));
    else {
      const can = R.every(r => (S.myResources[r]||0) >= (t.want[r]||0));
      box.append(h('div',{class:'row'},
        h('button',{class:'btn btn-sm btn-success', disabled:!can, onclick:() => socket.emit('respondTrade', {accept:true})}, can?'承諾':'資源不足'),
        h('button',{class:'btn btn-sm btn-danger', onclick:() => socket.emit('respondTrade', {accept:false})}, '拒否')));
    }
  }
  el.append(box);
}

/* 情報 */
function openInfo(){
  openModal('info', body => {
    body.append(h('div',{class:'modal-title'}, 'ゲーム情報'));
    body.append(h('div',{class:'tier-box'}, h('b',{}, CFG.label), h('br'),
      `${CFG.players}人 / ${CFG.hexes}タイル / 目標${CFG.targetScore}点`, h('br'),
      `資源山札 各${CFG.bank}枚 / 発展カード${CFG.devCards}枚（残り${S.deckCount}枚）`, h('br'),
      CFG.sbp ? '特別建設フェーズ：各手番の後、他の全員が順番に建設・カード購入できます（交易・カード使用は不可）' : '特別建設フェーズなし'));
    body.append(h('h4',{}, '銀行の山札'), h('div',{}, R.map(r => h('span',{class:'chip',style:`background:${RC[r]}`}, `${RS[r]} ${S.bank[r]}`))));
    body.append(h('h4',{}, '建設コスト'), h('ul',{class:'rules'},
      h('li',{}, `開拓地(1点): ${costText(COSTS.settlement)}`), h('li',{}, `都市(2点): ${costText(COSTS.city)}`),
      h('li',{}, `街道: ${costText(COSTS.road)}`), h('li',{}, `発展カード: ${costText(COSTS.dev)}`)));
    body.append(h('h4',{}, '特別カード'), h('ul',{class:'rules'},
      h('li',{}, `最長交易路(2点): 5本以上で最長 → ${S.longestOwner ? pname[S.longestOwner] : '該当なし'}`),
      h('li',{}, `最大騎士力(2点): 騎士3枚以上で最多 → ${S.armyOwner ? pname[S.armyOwner] : '該当なし'}`)));
    body.append(h('h4',{}, 'ルール要点'), h('ul',{class:'rules'},
      h('li',{}, '7の目: 手札8枚以上は半分(切り捨て)を廃棄 → 盗賊を必ず移動 → 隣接プレイヤーから1枚奪う'),
      h('li',{}, '開拓地は自分の街道に接し、隣の交差点が空いている場所のみ'),
      h('li',{}, '勝利は自分の手番中に目標点へ到達したとき'),
      h('li',{}, '資源の山札が足りないとき、受け取る人が複数なら誰も受け取れない')));
    body.append(h('h4',{}, 'ログ'));
    const log = h('div',{class:'log'}); LOG.slice().reverse().forEach(m => log.append(h('div',{}, m)));
    body.append(log, closeBtn());
  });
}

/* 勝利 */
function openWinner(){
  openModal('winner', body => {
    body.append(h('div',{class:'modal-title'}, '🎉 ゲーム終了'),
      h('div',{class:'modal-desc', style:'font-size:16px'}, S.winner ? `${S.winner.name} が ${S.winner.score} 点で勝利！` : ''));
    const col = h('div',{class:'col'});
    S.players.slice().sort((a,b) => b.score - a.score).forEach(p => col.append(h('div',{class:'card-row', style:`border-left:6px solid ${p.color}`}, h('b',{}, p.name), h('span',{}, `${p.score}点（勝利点カード込み）`))));
    body.append(col, h('button',{class:'btn btn-warning', onclick:() => { clearSession(); location.reload(); }}, 'ロビーへ戻る'));
  });
}
</script>
